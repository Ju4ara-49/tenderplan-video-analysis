name: Visual TenderPlan analysis

on:
  push:
    paths:
      - ".github/workflows/vision-analysis.yml"
      - "frames/*.jpg"
  workflow_dispatch:
    inputs:
      model:
        description: Ollama vision model
        required: false
        default: qwen2.5vl:3b
      max_frames:
        description: Maximum frames to describe
        required: false
        default: "57"

permissions:
  contents: read

jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify frames
        run: |
          set -euo pipefail
          count=$(find frames -maxdepth 1 -type f -name 'frame_*.jpg' | wc -l)
          echo "Frames found: $count"
          test "$count" -ge 1

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

      - name: Pull vision model
        env:
          MODEL: ${{ inputs.model || 'qwen2.5vl:3b' }}
        run: ollama pull "$MODEL"

      - name: Describe frames with vision model
        env:
          MODEL: ${{ inputs.model || 'qwen2.5vl:3b' }}
          MAX_FRAMES: ${{ inputs.max_frames }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, urllib.request

          model = os.environ["MODEL"]
          max_frames = int(os.environ["MAX_FRAMES"])
          paths = sorted(pathlib.Path("frames").glob("frame_*.jpg"))[:max_frames]
          out = pathlib.Path("analysis/VISION_FRAME_DESCRIPTIONS.md")
          out.parent.mkdir(parents=True, exist_ok=True)

          prompt = """Analyze this screenshot from a TenderPlan web-interface video.
          Describe only what is visibly present. Identify:
          1) page/screen type and major panels;
          2) visible controls, fields, buttons, tabs and filters;
          3) visible values/text that you can read;
          4) table/list columns and result-card structure;
          5) menus/dialogs/popups;
          6) any visible state change suggested by the screenshot.
          Do not invent functionality that is not visible. Be concise but concrete. Russian UI text must be preserved exactly when readable."""

          with out.open("w", encoding="utf-8") as f:
              f.write("# TenderPlan visual frame descriptions\n\n")
              f.write("Generated by a local Ollama vision model from the actual repository JPG frames.\n\n")

              for i, path in enumerate(paths, 1):
                  data = base64.b64encode(path.read_bytes()).decode("ascii")
                  payload = json.dumps({
                      "model": model,
                      "messages": [{
                          "role": "user",
                          "content": prompt,
                          "images": [data]
                      }],
                      "stream": False,
                      "options": {"temperature": 0.0}
                  }).encode()

                  req = urllib.request.Request(
                      "http://127.0.0.1:11434/api/chat",
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST"
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=300) as resp:
                          result = json.loads(resp.read().decode("utf-8"))
                      text = result.get("message", {}).get("content", "").strip()
                  except Exception as exc:
                      text = f"VISION_ERROR: {type(exc).__name__}: {exc}"

                  # Keep the report robust even if a model emits odd markdown.
                  text = re.sub(r"\n{3,}", "\n\n", text)
                  f.write(f"## {path.name}\n\n{text}\n\n")
                  print(f"[{i}/{len(paths)}] {path.name}")

          print(f"Wrote {out}")
          PY

      - name: Build machine-readable index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          src = Path("analysis/VISION_FRAME_DESCRIPTIONS.md").read_text(encoding="utf-8")
          blocks = re.split(r"(?m)^## (frame_\d+\.jpg)\n", src)[1:]
          rows = []
          for i in range(0, len(blocks), 2):
              if i + 1 < len(blocks):
                  rows.append({"frame": blocks[i], "description": blocks[i+1].strip()})
          Path("analysis/VISION_FRAME_DESCRIPTIONS.json").write_text(
              json.dumps(rows, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Upload visual analysis
        uses: actions/upload-artifact@v4
        with:
          name: tenderplan-vision-analysis
          path: |
            analysis/VISION_FRAME_DESCRIPTIONS.md
            analysis/VISION_FRAME_DESCRIPTIONS.json
          retention-days: 30
